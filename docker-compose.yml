services:
  organize:
    image: ab-tag-ai:latest
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://opencode.ai/zen/v1}
      - HARDCOVER_API_KEY=${HARDCOVER_API_KEY:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ${INPUT_DIR:-./input}:/input:ro
      - ${OUTPUT_DIR:-./output}:/output
    command: --input /input --output /output

  dry-run:
    image: ab-tag-ai:latest
    profiles: [check]
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://opencode.ai/zen/v1}
      - HARDCOVER_API_KEY=${HARDCOVER_API_KEY:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ${INPUT_DIR:-./input}:/input:ro
      - ${OUTPUT_DIR:-./output}:/output
    command: --input /input --output /output --dry-run
