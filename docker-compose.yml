services:
  organize:
    image: ghcr.io/dennisdurairaj/audiobook-metadata-ai:latest
    volumes:
      - /mnt/disk1/tmp/books:/input:ro
      - /mnt/disk1/tmp/output:/output
      - /mnt/disk1/tmp/config.yaml:/app/config.yaml:ro

  audiobookshelf-test:
    image: ghcr.io/advplyr/audiobookshelf:latest
    ports:
      - "13379:80"
    volumes:
      - ./abs-test/config:/config
      - ./abs-test/metadata:/metadata
      - /mnt/disk1/tmp/output:/output
