services:
  organize:
    image: ghcr.io/dennisdurairaj/ab-tag-ai:latest
    volumes:
      - ${INPUT_DIR:-./input}:/input:ro
      - ${OUTPUT_DIR:-./output}:/output
      - ${CONFIG_FILE:-./config.yaml}:/app/config.yaml:ro

  dry-run:
    image: ghcr.io/dennisdurairaj/ab-tag-ai:latest
    profiles: [check]
    volumes:
      - ${INPUT_DIR:-./input}:/input:ro
      - ${OUTPUT_DIR:-./output}:/output
      - ${CONFIG_FILE:-./config.yaml}:/app/config.yaml:ro
    command: --dry-run
